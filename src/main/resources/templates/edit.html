<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Page de modification</title>
    <meta charset="UTF-8">
    <style>
        body{
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        form{
            margin: 30px 20px;
        }
        .title-container{
            display: flex;
            align-items: center;
            margin: 20px 0px;
            gap: 10px;
        }
        .date-container{
            display: flex;
            align-items: center;
            margin: 20px 0px;
            gap: 10px;
        }
        .form button{
            display: block;
            text-decoration: none;
            margin: 30px 0px;
            padding: 2px 4px;
            border-radius: 3px;          
            cursor: pointer;
            font-size: 16px;
            color: aliceblue;
            font-weight: bold;
            line-height: 1.2;
            border: 2px solid #7973d3;
            background-color: #8e94e9;
        }
        input[type="date"]{
            padding: 6px 10px;
            font-size: 16px; 
        }
        input[type="text"]{
            padding: 6px 10px;
            font-size: 16px; 
        }
        a{
            /* margin: 60px 20px; */
            font-size: 16px;
            padding: 2px 4px;
            text-decoration: none;
            border-radius: 3px;
            line-height: 1.2;
            vertical-align: middle;
            color: aliceblue;
            font-weight: bold;
            border: 2px solid #2b2828;
            background-color: rgb(117, 109, 109);
        }
    </style>
</head>
<body>

<form class="form" th:action="@{/update}" th:object="${todo}" method="post">
    
    <input type="hidden" th:field="*{id}">
    
    <div class="title-container">
        <label>Title:</label>
        <input type="text" th:field="*{title}">
    </div>

    <div class="date-container">
        <label>Délai:</label>
        <input type="date" th:field="*{dueDate}">
    </div>
        
    
    <button type="submit">Modifier</button>
</form>

<a href="/">Retourner à la page d'accueil</a>

</body>
</html>
